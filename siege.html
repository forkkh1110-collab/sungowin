  h+=`<div class="card"><div class="row" style="justify-content:space-between"><h2>📦 보이는 매물량 추이 — 재료별 (주화 환산 개수)</h2>${rgBtn}</div>${smallMultiples(byItemR,SL,"coins",{unit:"개",invert:true,area:true})}<div style="margin-top:14px;font-size:13px;font-weight:700">한눈에 비교</div>${lineChart(ITEMS.map(it=>({name:it,color:COL[it],pts:byItemR(it).map(x=>[x.t,x.st.coins])})),{area:true,slots:SL,invert:true,labels:false})}</div>`;
  if((D.bids||[]).length){ const pts=(D.bids||[]).map(b=>{const o=(b.ranks||[]).find(r=>/선고|군림|MZ/.test(r.name||"")); const f=(b.ranks||[]).find(r=>r.rank===4); const t3=(b.ranks||[]).find(r=>r.rank===3); return {t:new Date(b.ts).getTime(),o:o&&o.coins,f:f&&f.coins,t3:t3&&t3.coins};});
    h+=`<div class="card"><h2>🏆 입찰 추이</h2>${lineChart([{name:"우리(선고)",color:"#8fb0e8",pts:pts.filter(p=>p.o!=null).map(p=>[p.t,p.o])},{name:"3위",color:"#f0c766",pts:pts.filter(p=>p.t3!=null).map(p=>[p.t,p.t3])},{name:"4위",color:"#ff96a3",pts:pts.filter(p=>p.f!=null).map(p=>[p.t,p.f])}],{slots:(D.bids||[]).map(b=>new Date(b.ts).getTime()),ref:[{v:500,label:"순위 반영 최소 500",color:"#8d93a3"}],invert:true})}
    <div style="overflow-x:auto"><table style="margin-top:8px"><tr><th>시각</th><th>순위표</th><th>남은 시간</th></tr>${(D.bids||[]).slice(-8).reverse().map(b=>`<tr><td>${tsK(b.ts)}</td><td style="text-align:left;white-space:normal">${(b.ranks||[]).map(r=>r.rank+"위 "+esc(r.name)+" "+(r.coins!=null?fmt(r.coins):"비공개")).join(" · ")}</td><td>${esc(b.left||"")}</td></tr>`).join("")}</table></div></div>`; }
  h+=dutyCard();
  // 메모·기록
  A.innerHTML=h;
  $("#pn").onchange=e=>{PLAN_N=Math.max(1,Number(e.target.value)||1); render();};
  document.querySelectorAll(".rg").forEach(b=>b.onclick=()=>{RANGE=b.dataset.r; render();});
}
render();
</script></body></html>
