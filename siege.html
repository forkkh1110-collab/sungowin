<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>공성 입찰 전략</title>
<style>
:root{--bg:#0d1119;--card:#151c29;--line:#222c3d;--fg:#e6e9f0;--mut:#8d93a3;--gold:#f0c766;--red:#ff96a3;--grn:#7fd6a0;--blu:#8fb0e8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
h1{font-size:19px;margin:0 0 4px}h2{font-size:15px;margin:0 0 8px}.sub{color:var(--mut);font-size:12.5px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kpi{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{font-size:20px;display:block}.kpi .l{color:var(--mut);font-size:12px}.gold{color:var(--gold)}.red{color:var(--red)}.grn{color:var(--grn)}.blu{color:var(--blu)}
input,textarea,button{font:inherit;color:inherit}input,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
button{background:rgba(192,143,31,.15);border:1px solid rgba(192,143,31,.5);color:var(--gold);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700}button.q{background:transparent;color:var(--mut);border-color:var(--line);font-weight:500}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:600}
svg{width:100%;height:auto;display:block}.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut)}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;border:1px solid var(--line);color:var(--mut)}.warn{color:var(--red);font-weight:700}
#lock{max-width:380px;margin:80px auto}
</style></head><body><div class="wrap">
<div id="lock" class="card"><h1>🏰 공성 입찰 전략</h1><div class="sub">길드장 전용. 비밀번호를 입력하세요. 5회 틀리면 30분 잠깁니다.</div>
<div class="row" style="margin-top:12px"><input id="pw" type="password" inputmode="numeric" placeholder="비밀번호" style="max-width:200px"><button id="go">열기</button></div><div id="lmsg" class="sub" style="margin-top:8px"></div></div>
<div id="app" style="display:none"></div>
</div>
<script>
const RECIPE={"철":20,"가죽":20,"보석":10,"축성수":4,"수련의 불꽃":1}, ITEMS=Object.keys(RECIPE), COL={"철":"#c9ced8","가죽":"#d49a6a","보석":"#5fd3e8","축성수":"#7fd6a0","수련의 불꽃":"#f0c766"};
const T_HIDE=new Date("2026-10-17T23:00:00+09:00"), T_CLOSE=new Date("2026-10-18T00:00:00+09:00"), T_WAR=new Date("2026-10-18T20:00:00+09:00");
const $=s=>document.querySelector(s), esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Number(n||0).toLocaleString("ko-KR"), f1=n=>Number(n||0).toLocaleString("ko-KR",{maximumFractionDigits:1}), f2=n=>Number(n||0).toLocaleString("ko-KR",{minimumFractionDigits:2,maximumFractionDigits:2});
/* 군선혈맹 사이트판: Apps Script 웹앱 doPost 로 같은 API·같은 비밀번호 */
const API_URL="https://script.google.com/macros/s/AKfycbxL0uAi8Kp2K_kR5qrSkvcvKbOx7PqUP35PPE-N2YAcV-ag9NcjmnFDSLK-42ZLp_m0tg/exec";
const api=b=>fetch(API_URL,{method:"POST",body:JSON.stringify(b)}).then(r=>r.json());
let STOK="", D=null, DUTY=null, PLAN_N=200, TAB="plan";
try{const v=JSON.parse(localStorage.getItem("sg-page")||"null"); if(v&&v.stok&&v.exp>Date.now()) STOK=v.stok;}catch(_){}
function left(t){const ms=t-Date.now(); if(ms<=0) return "종료"; const h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000); return (h>=24?Math.floor(h/24)+"일 ":"")+(h%24)+"시간 "+m+"분";}
function tsK(ts){return String(ts||"").slice(5,16).replace("T"," ");}
const tl=t=>{const d=new Date(t); return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
let RANGE="all";   // v97.7: 추이 차트 보기 범위(all|24|8 시간)
// 같은 품목·같은 시각(30분 슬롯)에 여러 장(스크롤) 캡처하면 한 묶음으로 합친다. 완전히 같은 줄(수량·총액)은 중복으로 보고 하나만 센다.
function slot(ts){const d=new Date(ts); d.setMinutes(d.getMinutes()<30?0:30,0,0); return d.getTime();}
function groups(){const G={}; (D.mkt||[]).forEach(s=>{const k=s.i+"|"+slot(s.t); const g=G[k]||(G[k]={i:s.i,t:s.t,slot:slot(s.t),by:s.by,r:[],seen:{}}); if(s.t>g.t) g.t=s.t; (s.r||[]).forEach(r=>{const id=r[0]+":"+r[1]; if(g.seen[id]) return; g.seen[id]=1; g.r.push(r);});}); return Object.values(G).sort((a,b)=>a.slot-b.slot);}
function snapStats(s){const rec=RECIPE[s.i]; const rows=(s.r||[]).map(r=>({qty:r[0],total:r[1],est:!!r[2],split:r[3]!==0,unit:r[1]/r[0]})).filter(r=>r.qty>0).sort((a,b)=>a.unit-b.unit);
  const min=rows.length?rows[0].unit*rec:null; const coins=rows.reduce((a,r)=>a+r.qty,0)/rec; const cost=rows.reduce((a,r)=>a+r.total,0); return {rows,min,coins,avg:coins?cost/coins:null,est:rows.some(r=>r.est)};}
function latest(){const L={}; groups().forEach(s=>{L[s.i]=s;}); return L;}
function plan(N,budget,L){L=L||latest(); let units=[]; ITEMS.forEach(it=>{const s=L[it]; if(!s) return; snapStats(s).rows.forEach(r=>{const rec=RECIPE[it]; const c=Math.floor(r.qty/rec); if(c<1) return; units.push({it,unit:r.unit,cpc:r.unit*rec,coins:c,qtyAll:r.qty,split:r.split,total:r.total,rec});});});
  units.sort((a,b)=>a.cpc-b.cpc); const out=[]; let got=0,spent=0;
  for(const u of units){ if(N&&got>=N) break; let take=u.coins; if(N) take=Math.min(take,N-got); if(!u.split) take=u.coins; const cost=u.split?take*u.rec*u.unit:u.total; if(budget&&spent+cost>budget){ if(!u.split) continue; take=Math.floor((budget-spent)/(u.rec*u.unit)); if(take<1) continue; }
    const cost2=u.split?take*u.rec*u.unit:u.total; out.push({it:u.it,unit:u.unit,cpc:u.cpc,coins:take,qty:u.split?take*u.rec:u.qtyAll,cost:cost2,split:u.split}); got+=take; spent+=cost2; }
  return {out,got,spent};}
// ── 시각화 (v97.6) ─────────────────────────────────────────────────────────
function lineChart(series,opt){ opt=opt||{}; // series:[{name,color,pts:[[t,v]]}] · 마지막 값 라벨 · 툴팁 · 점선 기준선(opt.ref=[{v,label}])
  const W=opt.w||900,H=opt.h||260,P={l:opt.w?44:50,r:opt.legend===false?20:110,t:opt.labels===false?14:30,b:30}; const all=series.flatMap(s=>s.pts); if(!all.length) return '<div class="sub">아직 데이터가 없어요.</div>';
  const xs=all.map(p=>p[0]), ys=all.map(p=>p[1]); let x0=Math.min(...xs),x1=Math.max(...xs); if(x1===x0){x0-=1800000;x1+=1800000;} if(opt.labels!==false){ const pad=(x1-x0)*0.05; x0-=pad; x1+=pad; } let y0=opt.zero===false?Math.min(...ys)*0.85:0, y1=Math.max(...ys,...(opt.ref||[]).map(r=>r.v))*1.12||1; if(y1<=y0) y1=y0+1;
  const X=t=>P.l+(t-x0)/(x1-x0)*(W-P.l-P.r), Y=v=>H-P.b-(v-y0)/(y1-y0)*(H-P.t-P.b); let g='';
  for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4; g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#222c3d"/><text x="${P.l-6}" y="${Y(v)+4}" fill="#8d93a3" font-size="11" text-anchor="end">${f1(v)}</text>`;}
  const span=x1-x0; const slots=(opt.slots&&opt.slots.length)?opt.slots.slice().sort((a,b)=>a-b):null;
  if(slots){ let lastDay="", lastX=-1e9; slots.forEach((t,i)=>{ const d=new Date(t); g+=`<line x1="${X(t)}" x2="${X(t)}" y1="${P.t}" y2="${H-P.b}" stroke="#222c3d" stroke-dasharray="2 4"/>`; if(X(t)-lastX<64) return; lastX=X(t); const day=(d.getMonth()+1)+"/"+d.getDate(); const lab=(day!==lastDay?day+" ":"")+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); lastDay=day; g+=`<text x="${X(t)}" y="${H-8}" fill="#c9ced8" font-size="11" text-anchor="middle">${lab}</text>`; }); }
  else { const nt=Math.min(8,Math.max(2,Math.round(span/1800000))); for(let i=0;i<=nt;i++){const t=x0+span*i/nt; const d=new Date(t); g+=`<text x="${X(t)}" y="${H-8}" fill="#8d93a3" font-size="11" text-anchor="middle">${span>86400000?(d.getMonth()+1)+"/"+d.getDate()+" ":""}${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}</text>`;} }
  (opt.ref||[]).forEach(r=>{ g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(r.v)}" y2="${Y(r.v)}" stroke="${r.color||'#ff96a3'}" stroke-dasharray="4 4"/><text x="${P.l+4}" y="${Y(r.v)-4}" fill="${r.color||'#ff96a3'}" font-size="11">${esc(r.label)}</text>`; });
  const lastYs=[], lab=[];
  series.forEach(s=>{ if(!s.pts.length) return; const pts=s.pts.slice().sort((a,b)=>a[0]-b[0]); const d=pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
    if(opt.labels!==false&&pts.length<=24) pts.forEach((p,i)=>{ if(opt.legend!==false&&i===pts.length-1) return; lab.push({x:X(p[0]),y:Y(p[1]),v:p[1],color:s.color,d:(i&&pts[i-1][1])?(p[1]-pts[i-1][1])/pts[i-1][1]*100:null}); });
    if(opt.area) g+=`<path d="${d} L${X(pts[pts.length-1][0]).toFixed(1)} ${Y(0)} L${X(pts[0][0]).toFixed(1)} ${Y(0)} Z" fill="${s.color}" opacity=".08"/>`;
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width||2.2}"${s.dash?' stroke-dasharray="6 4"':''}/>`+(s.nodots?'':pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3" fill="${s.color}"><title>${esc(s.name)} · ${tl(p[0])} · ${f2(p[1])}</title></circle>`).join(""));
    if(opt.legend===false) return; const last=pts[pts.length-1]; let ly=Y(last[1]); while(lastYs.some(v=>Math.abs(v-ly)<12)) ly+=12; lastYs.push(ly);
    const pv=(pts.length>1&&!s.nodots)?pts[pts.length-2][1]:null; const dp=(pv!=null&&pv)?(last[1]-pv)/pv*100:null; const dgood=dp==null?null:(opt.invert?dp>0:dp<0);
    g+=`<text x="${W-P.r+6}" y="${ly+4}" fill="${s.color}" font-size="11.5" font-weight="700">${esc(s.name)} ${f1(last[1])}${dp!=null&&Math.abs(dp)>=0.05?` <tspan fill="${dgood?'#7fd6a0':'#ff96a3'}" font-size="10.5">${dp>0?'▲':'▼'}${Math.abs(dp).toFixed(1)}%</tspan>`:''}</text>`; });
  // 점 라벨(값 + 직전 캡처 대비 %) — 같은 시각에 겹치면 위에서부터 22px 간격으로 밀어냄
  const byX={}; lab.forEach(l=>{ const k=Math.round(l.x); (byX[k]=byX[k]||[]).push(l); });
  Object.values(byX).forEach(arr=>{ arr.sort((a,b)=>a.y-b.y); let last=-1e9; arr.forEach(l=>{ let ly=Math.max(l.y-8,P.t+(l.d!=null?12:2)); if(ly-last<22) ly=last+22; l.ly=ly; last=ly; }); });
  const halo='paint-order="stroke" stroke="#0d1119" stroke-width="3"';
  lab.forEach(l=>{ g+=`<text x="${l.x}" y="${l.ly}" fill="${l.color}" font-size="10.5" font-weight="700" text-anchor="middle" ${halo}>${f1(l.v)}</text>`; if(l.d!=null&&Math.abs(l.d)>=0.05){ const good=opt.invert?l.d>0:l.d<0; g+=`<text x="${l.x}" y="${l.ly-10}" fill="${good?'#7fd6a0':'#ff96a3'}" font-size="9.5" font-weight="700" text-anchor="middle" ${halo}>${l.d>0?'▲':'▼'}${Math.abs(l.d).toFixed(1)}%</text>`; } });
  (opt.marks||[]).forEach(p=>{ g+=`<text x="${X(p[0])}" y="${Y(p[1])-8}" font-size="12" text-anchor="middle"><title>저점 ${tl(p[0])} · ${f1(p[1])}</title>⭐</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;}
function smallMultiples(byItem,SL,key,opt){ // 재료별 작은 추이 차트 5개 — 점마다 값·직전 대비 % 표기
  return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:12px">${ITEMS.map(it=>{ const pts=byItem(it).filter(x=>x.st[key]!=null).map(x=>[x.t,x.st[key]]); if(!pts.length) return ''; const vs=pts.map(p=>p[1]); const last=vs[vs.length-1], mn=Math.min(...vs), mx=Math.max(...vs);
    return `<div style="background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:12px;padding:8px 10px"><div class="row" style="justify-content:space-between"><b style="color:${COL[it]}">${esc(it)}</b><span class="sub">지금 <b style="color:var(--fg)">${f1(last)}${opt.unit||""}</b> · 최저 ${f1(mn)} · 최고 ${f1(mx)} · ${delta(last,vs.length>1?vs[vs.length-2]:null,opt.invert)}</span></div>${lineChart([{name:it,color:COL[it],pts}],{w:450,h:200,slots:SL,legend:false,zero:false,invert:opt.invert,area:opt.area})}</div>`; }).join("")}</div>`;}
function costBars(rowsC){ // 주화 1개 원가 — 재료별 가로 막대 + 가격 표시 + 30분 전 원가 눈금
  const rs=rowsC.filter(r=>r.st&&r.st.min!=null).sort((a,b)=>a.st.min-b.st.min); if(!rs.length) return '';
  const mx=Math.max(...rs.map(r=>Math.max(r.st.min,(r.prev&&r.prev.min)||0)))*1.08||1; const W=900,BH=30,GAP=12,L=116,R=190,H=rs.length*(BH+GAP)+GAP+22; const X=v=>L+v/mx*(W-L-R); let g='';
  for(let i=0;i<=4;i++){ const v=mx*i/4; g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${GAP-4}" y2="${H-20}" stroke="#222c3d"/><text x="${X(v)}" y="${H-6}" fill="#8d93a3" font-size="11" text-anchor="middle">${f1(v)}💎</text>`; }
  rs.forEach((r,i)=>{ const y=GAP+i*(BH+GAP); const pv=r.prev?r.prev.min:null; const bw=X(r.st.min)-L;
    g+=`<text x="${L-8}" y="${y+BH/2+4}" fill="${COL[r.it]}" font-size="12.5" font-weight="700" text-anchor="end">${i===0?"⭐ ":""}${esc(r.it)}</text><rect x="${L}" y="${y}" width="${bw}" height="${BH}" rx="6" fill="${COL[r.it]}" opacity="${i===0?1:.6}"><title>${esc(r.it)} ${RECIPE[r.it]}개 × ${f2(r.st.rows[0].unit)}💎 = ${f1(r.st.min)}💎</title></rect>`;
    if(bw>120) g+=`<text x="${L+8}" y="${y+BH/2+4}" fill="#0d1119" font-size="11" font-weight="700">${RECIPE[r.it]}개 × ${f2(r.st.rows[0].unit)}</text>`;
    g+=`<text x="${X(Math.max(r.st.min,pv||0))+8}" y="${y+BH/2+4}" fill="#e6e9f0" font-size="13" font-weight="700">${f1(r.st.min)}💎</text>`;
    if(pv!=null){ g+=`<line x1="${X(pv)}" x2="${X(pv)}" y1="${y-4}" y2="${y+BH+4}" stroke="#e6e9f0" stroke-width="2" stroke-dasharray="3 2"><title>직전 인증 ${f1(pv)}💎</title></line>`; const p=(r.st.min-pv)/pv*100; const txt=Math.abs(p)<0.05?'= 0%':(p>0?'▲':'▼')+Math.abs(p).toFixed(1)+'%'; g+=`<text x="${W-4}" y="${y+BH/2+4}" fill="${Math.abs(p)<0.05?'#8d93a3':(p<0?'#7fd6a0':'#ff96a3')}" font-size="11.5" font-weight="700" text-anchor="end">직전 인증 ${f1(pv)} ${txt}</text>`; } });
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg><div class="sub">막대 = 주화 1개 원가(레시피 수량 × 최저 개당가) · 점선 눈금 = 직전 인증 때 원가 · ⭐ = 지금 가장 싼 재료</div>`;}
function costTimeline(G,N){ // 구매 시점별 — 그 시각 매물로 주화 N개 만들 때 총 비용(재료별 쌓은 막대) + 평균 원가(선)
  const slots=[...new Set(G.map(s=>s.slot))].sort((a,b)=>a-b); if(!slots.length) return '';
  const rows=slots.map(sl=>{ const L={}; G.filter(x=>x.slot===sl).forEach(x=>{L[x.i]=x;}); const P=plan(N,0,L); const by={}; P.out.forEach(u=>{by[u.it]=(by[u.it]||0)+u.cost;}); return {slot:sl,got:P.got,cost:P.spent,ok:P.got>=N,avg:P.got?P.spent/P.got:null,by}; });
  const ok=rows.filter(r=>r.ok); const best=ok.length?ok.reduce((a,b)=>b.cost<a.cost?b:a):null; const cur=rows[rows.length-1]; const tl=t=>{const d=new Date(t); return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
  const W=900,H=300,P={l:70,r:20,t:44,b:30}; const n=rows.length; const cw=(W-P.l-P.r)/n; const bw=Math.min(56,cw*0.62);
  const mxC=Math.max(...rows.map(r=>r.cost))*1.2||1; const Y=v=>H-P.b-v/mxC*(H-P.t-P.b), X=i=>P.l+cw*(i+0.5); const halo='paint-order="stroke" stroke="#0d1119" stroke-width="3"'; let g='';
  for(let i=0;i<=4;i++){ const v=mxC*i/4; g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#222c3d"/><text x="${P.l-6}" y="${Y(v)+4}" fill="#f0c766" font-size="11" text-anchor="end">${fmt(Math.round(v))}</text>`; }
  g+=`<text x="${P.l-6}" y="${P.t-24}" fill="#f0c766" font-size="11" text-anchor="end">총 비용💎</text><text x="${P.l+4}" y="${P.t-24}" fill="#8d93a3" font-size="11">막대 위 = 총 비용(직전 캡처 대비 %) · 막대 안 = 평균 원가/개 · 색 = 재료별 비용</text>`;
  const step=Math.ceil(n/14); let lastDay="";
  rows.forEach((r,i)=>{ const x=X(i); let y=Y(0); ITEMS.forEach(it=>{ const c=r.by[it]; if(!c) return; const h=Y(0)-Y(c); g+=`<rect x="${x-bw/2}" y="${y-h}" width="${bw}" height="${h}" fill="${COL[it]}" opacity="${r.ok?.9:.35}"><title>${tl(r.slot)} · ${esc(it)} ${fmt(Math.round(c))}💎</title></rect>`; y-=h; });

  h+=`<div class="card"><div class="row" style="justify-content:space-between"><h2>📈 주화 1개 원가 추이 — 재료별 (처음 인증부터 · 점마다 값 · 직전 대비 %)</h2>${rgBtn}</div>${smallMultiples(byItemR,SL,"min",{unit:"💎"})}<div style="margin-top:14px;font-size:13px;font-weight:700">한눈에 비교</div>${lineChart(ITEMS.map(it=>({name:it,color:COL[it],pts:byItemR(it).filter(x=>x.st.min!=null).map(x=>[x.t,x.st.min])})),{slots:SL,labels:false,ref:isFinite(minAll)?[{v:minAll,label:"기간 최저 "+f1(minAll)}]:[]})}</div>`;
  h+=`<div class="card"><div class="row" style="justify-content:space-between"><h2>📦 보이는 매물량 추이 — 재료별 (주화 환산 개수)</h2>${rgBtn}</div>${smallMultiples(byItemR,SL,"coins",{unit:"개",invert:true,area:true})}<div style="margin-top:14px;font-size:13px;font-weight:700">한눈에 비교</div>${lineChart(ITEMS.map(it=>({name:it,color:COL[it],pts:byItemR(it).map(x=>[x.t,x.st.coins])})),{area:true,slots:SL,invert:true,labels:false})}</div>`;
  if((D.bids||[]).length){ const pts=(D.bids||[]).map(b=>{const o=(b.ranks||[]).find(r=>/선고|군림|MZ/.test(r.name||"")); const f=(b.ranks||[]).find(r=>r.rank===4); const t3=(b.ranks||[]).find(r=>r.rank===3); return {t:new Date(b.ts).getTime(),o:o&&o.coins,f:f&&f.coins,t3:t3&&t3.coins};});
    h+=`<div class="card"><h2>🏆 입찰 추이</h2>${lineChart([{name:"우리(선고)",color:"#8fb0e8",pts:pts.filter(p=>p.o!=null).map(p=>[p.t,p.o])},{name:"3위",color:"#f0c766",pts:pts.filter(p=>p.t3!=null).map(p=>[p.t,p.t3])},{name:"4위",color:"#ff96a3",pts:pts.filter(p=>p.f!=null).map(p=>[p.t,p.f])}],{slots:(D.bids||[]).map(b=>new Date(b.ts).getTime()),ref:[{v:500,label:"순위 반영 최소 500",color:"#8d93a3"}],invert:true})}
    <div style="overflow-x:auto"><table style="margin-top:8px"><tr><th>시각</th><th>순위표</th><th>남은 시간</th></tr>${(D.bids||[]).slice(-8).reverse().map(b=>`<tr><td>${tsK(b.ts)}</td><td style="text-align:left;white-space:normal">${(b.ranks||[]).map(r=>r.rank+"위 "+esc(r.name)+" "+(r.coins!=null?fmt(r.coins):"비공개")).join(" · ")}</td><td>${esc(b.left||"")}</td></tr>`).join("")}</table></div></div>`; }
  h+=dutyCard();
  // 메모·기록
  h+=`<div class="card"><h2>📝 전략 메모</h2><textarea id="memo" rows="8" placeholder="입찰 목표, 예산, 연합(선고·군림·MZ) 분담, 구매 타이밍…">${esc((D.memo||{}).text||"")}</textarea><div class="row" style="margin-top:8px"><button id="ms">저장</button><span class="sub">${(D.memo||{}).ts?"마지막 저장 "+tsK(D.memo.ts):""}</span><span id="mm" class="sub"></span></div></div>`;
  h+=`<div class="card"><h2>🧾 기록</h2><div class="sub">${(D.log||[]).slice(-12).reverse().map(x=>tsK(x.ts)+" · "+esc(x.nick)+" "+esc(x.act)).join("<br>")||"없음"}</div></div>`;
  A.innerHTML=h;
  $("#rl").onclick=load; $("#out").onclick=()=>{try{localStorage.removeItem("sg-page")}catch(_){} api({type:"siege-page-logout",stok:STOK}).catch(()=>{}); STOK=""; location.reload();};
  $("#pn").onchange=e=>{PLAN_N=Math.max(1,Number(e.target.value)||1); render();};
  document.querySelectorAll(".rg").forEach(b=>b.onclick=()=>{RANGE=b.dataset.r; render();});
  $("#ms").onclick=async()=>{ $("#mm").textContent="저장 중…"; try{const j=await api({type:"siege-page-memo",stok:STOK,text:$("#memo").value}); $("#mm").textContent=j&&j.ok?"저장했어요.":"실패: "+(j&&j.error);}catch(e){$("#mm").textContent="저장 실패";} };
}
async function load(){ $("#lock").style.display="none"; $("#app").style.display=""; render(); try{const j=await api({type:"siege-page-get",stok:STOK}); if(j&&j.ok){D=j; render(); api({type:"siege-page-duty-get",stok:STOK}).then(x=>{if(x&&x.ok){DUTY=x; render();}}).catch(()=>{});} else { STOK=""; try{localStorage.removeItem("sg-page")}catch(_){} $("#app").style.display="none"; $("#lock").style.display=""; $("#lmsg").textContent="세션이 끝났어요. 다시 입력해 주세요."; } }catch(e){ $("#app").innerHTML='<div class="card red">서버 응답 없음 — 잠시 뒤 새로고침해 주세요.</div>'; } }
$("#go").onclick=async()=>{ const pw=$("#pw").value.trim(); if(!pw) return; $("#go").disabled=true; $("#lmsg").textContent="확인 중…";
  try{ let dev=""; try{dev=(navigator.platform||"")+" "+(navigator.userAgent||"").slice(0,40);}catch(_){}
    const j=await api({type:"siege-page-login",pw,dev}); if(j&&j.ok){ STOK=j.stok; try{localStorage.setItem("sg-page",JSON.stringify({stok:j.stok,exp:j.exp}))}catch(_){} load(); }
    else $("#lmsg").textContent=({locked:"여러 번 틀려 30분 동안 잠겼어요.",bad_pw:"비밀번호가 맞지 않아요."+(j&&j.left!=null?" (남은 기회 "+j.left+"번)":""),no_pw:"비밀번호가 아직 설정되지 않았어요."})[j&&j.error]||"확인 실패"; }
  catch(e){ $("#lmsg").textContent="서버 응답 없음"; } $("#go").disabled=false; };
$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("#go").click();});
if(STOK) load();
</script></body></html>
